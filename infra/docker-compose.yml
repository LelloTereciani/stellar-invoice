services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN}
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK}
      NEXT_PUBLIC_STELLAR_ISSUER: ${NEXT_PUBLIC_STELLAR_ISSUER}
      STELLAR_DISTRIBUTION_SECRET: ${STELLAR_DISTRIBUTION_SECRET}
      DEMO_MODE: ${DEMO_MODE:-disabled}
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    depends_on:
      api-gw:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
