services:
  api-gw:
    # Keep the API gateway internal; the app or reverse proxy joins this network.
    # Mantém o gateway interno; o app ou proxy reverso participa desta rede.
    ports: !reset []

  supavisor:
    # Database and pooler must not be directly reachable from the internet.
    # Banco e pooler não podem ser alcançáveis diretamente pela internet.
    ports: !reset []

  db:
    volumes:
      # Initialize product tables only on a new persistent database volume.
      # Inicializa as tabelas do produto somente em um volume novo e persistente.
      - ../../supabase/migrations/0001_invoices.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0001.sql:ro,Z
      - ../../supabase/migrations/0002_policies.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0002.sql:ro,Z
      - ../../supabase/migrations/0003_confirm_invoice_hardening.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0003.sql:ro,Z
      - ../../supabase/migrations/0004_demo_sessions.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0004.sql:ro,Z
      - ../../supabase/migrations/0005_demo_distributions.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0005.sql:ro,Z
      - ../../supabase/migrations/0006_issuer_challenges.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0006.sql:ro,Z
      - ../../supabase/migrations/0007_issuer_challenge_rate_limit.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0007.sql:ro,Z
      - ../../supabase/migrations/0008_invoice_lifecycle.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0008.sql:ro,Z
      - ../../supabase/migrations/0009_wallet_authentication.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0009.sql:ro,Z
      - ../../supabase/migrations/0010_service_role_privileges.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0010.sql:ro,Z
      - ../../supabase/migrations/0011_demo_distribution_state_machine.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0011.sql:ro,Z
      - ../../supabase/migrations/0012_demo_invoice.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0012.sql:ro,Z
      - ../../supabase/migrations/0013_invoice_payment_integrity.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0013.sql:ro,Z
      - ../../supabase/migrations/0014_prepared_invoice_payments.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0014.sql:ro,Z
      - ../../supabase/migrations/0015_demo_distribution_serialization.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0015.sql:ro,Z
      - ../../supabase/migrations/0016_demo_rate_limit_increase.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0016.sql:ro,Z
