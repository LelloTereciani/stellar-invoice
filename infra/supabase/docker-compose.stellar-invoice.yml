services:
  api-gw:
    # Keep the API gateway internal; the app or reverse proxy joins this network.
    # Mantém o gateway interno; o app ou proxy reverso participa desta rede.
    ports: !reset []

  supavisor:
    # Database and pooler must not be directly reachable from the internet.
    # Banco e pooler não podem ser alcançáveis diretamente pela internet.
    ports: !reset []

  db:
    volumes:
      # Initialize product tables only on a new persistent database volume.
      # Inicializa as tabelas do produto somente em um volume novo e persistente.
      - ../../supabase/migrations/0001_invoices.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0001.sql:ro,Z
      - ../../supabase/migrations/0002_policies.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0002.sql:ro,Z
      - ../../supabase/migrations/0003_confirm_invoice_hardening.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0003.sql:ro,Z
      - ../../supabase/migrations/0004_demo_sessions.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0004.sql:ro,Z
      - ../../supabase/migrations/0005_demo_distributions.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0005.sql:ro,Z
      - ../../supabase/migrations/0006_issuer_challenges.sql:/docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0006.sql:ro,Z
