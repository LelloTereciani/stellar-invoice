services:
  api-gw:
    depends_on:
      studio:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - /docker-entrypoint.sh
    environment:
      ANON_KEY: ${ANON_KEY}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
    healthcheck:
      interval: 10s
      retries: 3
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'
      timeout: 5s
    image: envoyproxy/envoy:v1.39.0
    networks:
      default:
        aliases:
          - envoy
          - kong
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: ./infra/supabase/volumes/api/envoy/envoy.yaml
        target: /etc/envoy/envoy.yaml
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./infra/supabase/volumes/api/envoy/cds.yaml
        target: /etc/envoy/cds.yaml
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./infra/supabase/volumes/api/envoy/lds.template.yaml
        target: /etc/envoy/lds.template.yaml
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: ./infra/supabase/volumes/api/envoy/docker-entrypoint.sh
        target: /docker-entrypoint.sh
        type: bind
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api-gw:
        condition: service_started
        required: true
    environment:
      APP_ORIGIN: ${APP_ORIGIN}
      DEMO_MODE: ${DEMO_MODE:-disabled}
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_STELLAR_ISSUER: ${NEXT_PUBLIC_STELLAR_ISSUER}
      NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK}
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      STELLAR_DISTRIBUTION_SECRET: ${STELLAR_DISTRIBUTION_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_URL: http://api-gw:8000
    expose:
      - "3000"
    networks:
      default: null
    restart: unless-stopped
  backup:
    command:
      - /bin/sh
      - /usr/local/bin/easypanel-backup.sh
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      PGDATABASE: ${POSTGRES_DB}
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: postgres
    image: postgres:17-alpine
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - read_only: true
        source: ./infra/easypanel-backup.sh
        target: /usr/local/bin/easypanel-backup.sh
        type: bind
      - source: postgres-backups
        target: /backups
        type: volume
  auth:
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9999/health
      timeout: 5s
    image: supabase/gotrue:v2.189.0
    networks:
      default: null
    restart: unless-stopped
  db:
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      JWT_EXP: ${JWT_EXPIRY}
      JWT_SECRET: ${JWT_SECRET}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    healthcheck:
      interval: 5s
      retries: 10
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -h
        - localhost
      timeout: 5s
    image: supabase/postgres:17.6.1.136
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        type: bind
      - source: postgres-data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        source: ./infra/supabase/volumes/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        type: bind
      - source: db-config
        target: /etc/postgresql-custom
        type: volume
        volume: {}
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0001_invoices.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0001.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0002_policies.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0002.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0003_confirm_invoice_hardening.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0003.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0004_demo_sessions.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0004.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0005_demo_distributions.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0005.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0006_issuer_challenges.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0006.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0007_issuer_challenge_rate_limit.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0007.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0008_invoice_lifecycle.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0008.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0009_wallet_authentication.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0009.sql
        type: bind
