        read_only: true
        source: ./supabase/migrations/0010_service_role_privileges.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0010.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0011_demo_distribution_state_machine.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0011.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0012_demo_invoice.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0012.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0013_invoice_payment_integrity.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0013.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0014_prepared_invoice_payments.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0014.sql
        type: bind
      - bind:
          create_host_path: true
          selinux: Z
        read_only: true
        source: ./supabase/migrations/0015_demo_distribution_serialization.sql
        target: /docker-entrypoint-initdb.d/init-scripts/zzz-stellar-invoice-0015.sql
        type: bind
  functions:
    command:
      - start
      - --main-service
      - /home/deno/functions/main
    depends_on:
      api-gw:
        condition: service_healthy
        required: true
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEYS: '{"default":"${SUPABASE_PUBLISHABLE_KEY:-}"}'
      SUPABASE_SECRET_KEYS: '{"default":"${SUPABASE_SECRET_KEY:-}"}'
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_URL: http://api-gw:8000
      VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD-SHELL
        - timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'
      timeout: 5s
    image: supabase/edge-runtime:v1.74.0
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        source: ./infra/supabase/volumes/functions
        target: /home/deno/functions
        type: bind
      - source: deno-cache
        target: /root/.cache/deno
        type: volume
        volume: {}
  imgproxy:
    environment:
      IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
      IMGPROXY_BIND: :5001
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8
      IMGPROXY_USE_ETAG: "true"
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD
        - imgproxy
        - health
      timeout: 5s
    image: darthsim/imgproxy:v3.30.1
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: storage-data
        target: /var/lib/storage
        type: volume
        volume: {}
  meta:
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_USER: postgres
      PG_META_PORT: 8080
    image: supabase/postgres-meta:v0.96.6
    networks:
      default: null
    restart: unless-stopped
  realtime:
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      API_JWT_SECRET: ${JWT_SECRET}
      APP_NAME: realtime
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      DB_HOST: ${POSTGRES_HOST}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DISABLE_HEALTHCHECK_LOGGING: "true"
      DNS_NODES: ''''''
      ERL_AFLAGS: -proto_dist inet_tcp
      METRICS_JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      RLIMIT_NOFILE: "10000"
      RUN_JANITOR: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      SEED_SELF_HOST: "true"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
        - CMD-SHELL
        - 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer ${ANON_KEY}" http://localhost:4000/api/tenants/realtime-dev/health'
      timeout: 5s
    image: supabase/realtime:v2.102.3
    networks:
      default: null
    restart: unless-stopped
  rest:
    command:
      - postgrest
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_JWKS:-${JWT_SECRET}}
    healthcheck:
      interval: 5s
      retries: 3
      test:
        - CMD
        - postgrest
        - --ready
      timeout: 5s
    image: postgrest/postgrest:v14.12
    networks:
      default: null
    restart: unless-stopped
  storage:
    depends_on:
      db:
        condition: service_healthy
        required: true
      imgproxy:
        condition: service_started
        required: true
      rest:
        condition: service_started
        required: true
    environment:
      ANON_KEY: ${ANON_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      ENABLE_IMAGE_TRANSFORMATION: "true"
      FILE_SIZE_LIMIT: 52428800
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
      IMGPROXY_URL: http://imgproxy:5001
      POSTGREST_URL: http://rest:3000
      REGION: ${REGION}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      STORAGE_BACKEND: file
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      TENANT_ID: ${STORAGE_TENANT_ID}
    healthcheck:
      interval: 5s
      retries: 3
      start_period: 10s
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://storage:5000/status
      timeout: 5s
    image: supabase/storage-api:v1.60.4
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - source: storage-data
        target: /var/lib/storage
        type: volume
        volume: {}
  studio:
    environment:
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      ENABLED_FEATURES_LOGS_ALL: "false"
      HOSTNAME: 0.0.0.0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER_READ_WRITE: postgres
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_URL: http://api-gw:8000
    healthcheck:
      interval: 5s
      retries: 3
      start_period: 20s
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 10s
    image: supabase/studio:2026.08.03-sha-022b374
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        source: ./infra/supabase/volumes/snippets
        target: /app/snippets
        type: bind
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./infra/supabase/volumes/functions
        target: /app/edge-functions
        type: bind
  supavisor:
    command:
      - /bin/sh
      - -c
      - /app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      API_JWT_SECRET: ${JWT_SECRET}
      CLUSTER_POSTGRES: "true"
      DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
      DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
      ERL_AFLAGS: -proto_dist inet_tcp
      METRICS_JWT_SECRET: ${JWT_SECRET}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: transaction
      POOLER_TENANT_ID: ${POOLER_TENANT_ID}
      PORT: 4000
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REGION: local
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
    healthcheck:
      interval: 10s
      retries: 10
      start_period: 30s
      test:
        - CMD
        - curl
        - -sSfL
        - --head
        - -o
        - /dev/null
        - http://127.0.0.1:4000/api/health
      timeout: 5s
    image: supabase/supavisor:2.9.5
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
          selinux: z
        read_only: true
        source: ./infra/supabase/volumes/pooler/pooler.exs
        target: /etc/pooler/pooler.exs
        type: bind
volumes:
  db-config: {}
  deno-cache: {}
  postgres-backups: {}
  postgres-data: {}
  storage-data: {}
