name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser payment flow
        run: pnpm test:e2e
      - name: Validate operations scripts
        run: |
          shellcheck infra/*.sh tests/operations/*.sh tests/operations/bin/docker
          sh tests/operations/backup-failure.sh
      - name: Validate private Compose topology
        run: |
          docker compose --env-file infra/supabase/.env.example --env-file infra/.env.example \
            -f infra/supabase/docker-compose.yml \
            -f infra/supabase/docker-compose.stellar-invoice.yml \
            -f infra/supabase/docker-compose.app.yml config --quiet
          published=$(docker compose --env-file infra/supabase/.env.example --env-file infra/.env.example \
            -f infra/supabase/docker-compose.yml \
            -f infra/supabase/docker-compose.stellar-invoice.yml \
            -f infra/supabase/docker-compose.app.yml config --format json \
            | jq -r '.services | to_entries[] | select(.value.ports != null and (.value.ports | length > 0)) | .key' | sort -u)
          test "$published" = caddy
      - name: Validate Caddy configuration
        run: docker run --rm --volume "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" --env APP_DOMAIN=localhost caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build and smoke-test production image
        run: |
          docker build --tag stellar-invoice:test .
          docker run --detach --name stellar-invoice-test --publish 127.0.0.1:3000:3000 stellar-invoice:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs stellar-invoice-test; exit 1; fi
            sleep 1
          done
          headers=$(curl --fail --silent --dump-header - --output /dev/null http://127.0.0.1:3000/ | tr -d '\r')
          csp=$(printf '%s\n' "$headers" | sed -n '/^[Cc]ontent-[Ss]ecurity-[Pp]olicy:/p')
          test -n "$csp"
          ! printf '%s\n' "$csp" | grep -Eq "script-src[^;]*'unsafe-inline'"
          test "$(docker inspect --format '{{.Config.User}}' stellar-invoice-test)" = nextjs
          docker rm --force stellar-invoice-test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stellar_invoice_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stellar_invoice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: stellar_invoice_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap Supabase roles
        run: psql --file tests/integration/postgres-bootstrap.sql
      - name: Apply migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql --file "$migration"
          done
      - name: Verify privileges, RLS, and lifecycle
        run: psql --file tests/integration/database.sql
      - name: Verify exact decimal through real PostgREST JSON
        run: |
          psql <<'SQL'
          insert into public.invoices(debtor_public_key, issuer_public_key, asset_code, asset_issuer, amount, memo, due_at)
          values ('GAC7JSXMBOC5F2MOE7NT3VC3YLSQRKVS2OGF3PWLOSHX3QWPAG2RZ4OY', 'GDTTX5V34X5BFL74VTHDU2W2555DYASROG2O23DNP3SKF3EUCK6FAHBH', 'BRLT', 'GDTTX5V34X5BFL74VTHDU2W2555DYASROG2O23DNP3SKF3EUCK6FAHBH', 1234567890123.1234567, 'postgrest-exact', now() + interval '1 day');
          SQL
          jwt_secret=$(sed -n 's/^JWT_SECRET=//p' infra/supabase/.env.example | head -n 1)
          docker run --detach --name stellar-invoice-postgrest --network host \
            --env PGRST_DB_URI='postgresql://authenticator:postgrest-integration-only@127.0.0.1:5432/stellar_invoice_test' \
            --env PGRST_DB_SCHEMAS=public --env PGRST_DB_ANON_ROLE=anon --env PGRST_JWT_SECRET="$jwt_secret" \
            postgrest/postgrest:v14.12
          trap 'docker rm --force stellar-invoice-postgrest >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then break; fi; sleep 1; done
          token=$(POSTGREST_TEST_JWT_SECRET="$jwt_secret" node tests/integration/postgrest-token.mjs)
          response=$(curl --fail --silent --header "Authorization: Bearer $token" 'http://127.0.0.1:3000/invoices?select=amount_text&memo=eq.postgrest-exact')
          test "$(jq -r '.[0].amount_text' <<<"$response")" = '1234567890123.1234567'
      - name: Prove logical backup and isolated restore
        env:
          BACKUP_DIR: /tmp/stellar-invoice-backups
          BACKUP_LOCAL_POSTGRES: enabled
        run: |
          infra/backup.sh
          backup=$(find "$BACKUP_DIR" -type f -name 'stellar-invoice-*.sql.gz' -print -quit)
          test -n "$backup"
          restore_output=''
          restore_passed=false
          for restore_attempt in 1 2 3; do
            if attempt_output=$(infra/restore-check.sh "$backup" postgrest-exact 2>&1); then
              restore_output=$attempt_output
              restore_passed=true
              break
            fi
            restore_output=$(printf '%s\nRestore attempt %s failed:\n%s' "$restore_output" "$restore_attempt" "$attempt_output")
            case "$attempt_output" in
              *'connection to server'* ) sleep 2 ;;
              * ) break ;;
            esac
          done
          if [ "$restore_passed" != true ]; then
            printf '%s\n' "$restore_output"
            annotation=$(printf '%s\n' "$restore_output" | tail -n 30 | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')
            echo "::error file=infra/restore-check.sh::$annotation"
            exit 1
          fi
          printf '%s\n' "$restore_output"
